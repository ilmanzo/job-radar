# Example candidate profile (template). Do NOT put your data here.
# Copy to data/profile.local.yaml (git-ignored) and fill it from your CV; see README "Personalize".
# Nothing below has a built-in fallback in code: what you omit is simply not scored.

candidate:
  name: "Jane Doe"
  headline: "Senior Platform Engineer"
  current_role: "Platform Engineer"
  experience_years: 10
  # REQUIRED: country of residence (key of data/countries.yaml). Or set CANDIDATE_COUNTRY in .env.
  # Left empty on purpose so an unconfigured install fails fast instead of scoring for a wrong country.
  location: ""
  # Optional secondary countries accepted for direct employment / relocation
  allowed_locations: []
  # Optional: drop hybrid/on-site roles outside `city`
  remote_only: false
  city: ""
  contract_preference: "Employee contract (direct entity or EOR)"
  website: "https://example.com"

# Salary tiers (EUR equivalent). Omit a tier to disable it.
# Optional B2B / contractor policy. By default postings that only offer B2B, freelance or
# independent-contractor engagements are dropped.
# contract:
#   b2b: accept          # drop (default) | accept
#   b2b_bonus: 10        # score bonus for accepted B2B postings (tagged contract:b2b)
#   b2b_patterns:        # extra regexes marking a posting as B2B
#     - "\\bcontract[\\s-]to[\\s-]hire\\b"

# Optional work arrangement preference (remote / hybrid / on-site). Detected from the job
# location, title and description and tagged mode:remote|hybrid|onsite|unknown.
# Without this section work mode does not affect the score. Example promoting remote work:
# work_mode:
#   remote_bonus: 30       # fully remote / home based / work from anywhere
#   hybrid_bonus: 15       # partly remote, hybrid model, flexible location
#   onsite_penalty: -30    # explicitly on-site / in-office / "not remote"
#   unknown_penalty: -10   # description says nothing about the arrangement
#   drop_onsite: false     # true removes explicitly on-site postings altogether
#   remote_patterns:       # extra regexes counted as remote
#     - "\\bdistributed\\s+team\\b"
#   ignore_patterns:       # boilerplate that should not count ("remote work where possible")
#     - "remote\\s+work\\s+where\\s+possible"

# Target compensation tiers (in EUR equivalent) used for salary scoring & notification alerts
compensation:
  currency: "EUR"
  target_high: 150000    # +35 score
  target_mid: 120000     # +25 score
  target_low: 85000      # +15 score; below it -10

# Domain pillars (context for you and for an LLM generating targets / skill_matrix)
deep_domain_expertise:
  - category: "Cloud Platform & Kubernetes"
    description: "Kubernetes operations, infrastructure as code, cloud networking."
    keywords: ["kubernetes", "terraform", "aws", "gcp", "helm"]
  - category: "Linux Systems & Observability"
    description: "Linux internals, eBPF tracing, metrics and logging pipelines."
    keywords: ["linux", "ebpf", "prometheus", "opentelemetry"]
  - category: "Backend Languages"
    description: "Services and tooling in Go and Python."
    keywords: ["go", "golang", "python"]

# Keyword weights for job titles and descriptions
scoring_weights:
  title_keywords:
    platform: 25
    infrastructure: 20
    sre: 25
    devops: 20
    cloud: 20
    linux: 20
    kubernetes: 20
  body_keywords:
    kubernetes: 15
    terraform: 15
    linux: 15
    ebpf: 15
    go: 15
    golang: 15
    python: 15
    aws: 10
    observability: 15

# Skill matrix: regex -> skill name, weight, tailored pitch bullet.
# match % = sum(weights of matched skills) / 80, capped at 100.
skill_matrix:
  - pattern: "\\bkubernetes\\b|\\bk8s\\b|\\bhelm\\b"
    name: "Kubernetes"
    weight: 25
    pitch: "Highlight running production Kubernetes clusters and their upgrade/incident history."
  - pattern: "\\bcloud\\b|\\baws\\b|\\bgcp\\b|\\bazure\\b"
    name: "Cloud Platform"
    weight: 20
    pitch: "Reference cloud infrastructure you designed or operated, with scale numbers."
  - pattern: "\\bebpf\\b|\\bkernel\\b|\\btracing\\b|\\buprobes?\\b"
    name: "Linux Kernel & eBPF"
    weight: 25
    pitch: "Point to concrete kernel or eBPF tracing work and what it uncovered."
  - pattern: "\\bgolang\\b|\\bgo\\b"
    name: "Go"
    weight: 20
    pitch: "Mention Go services or tools you shipped."
  - pattern: "\\bpython\\b"
    name: "Python Automation"
    weight: 15
    pitch: "Mention Python automation that saved measurable time."
  - pattern: "\\bobservability\\b|\\bprometheus\\b|\\bopentelemetry\\b|\\bmonitoring\\b"
    name: "Observability"
    weight: 15
    pitch: "Describe a metrics/alerting pipeline you built and the incidents it caught."

# Pitch bullets used when no skill_matrix entry matches
fallback_pitch:
  - "Highlight your platform engineering background and the scale you operated at."
